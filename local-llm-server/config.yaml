# ════════════════════════════════════════════════════════════════════════════════
# LOCAL LLM CLOUD — PRODUCTION CONFIGURATION
# ════════════════════════════════════════════════════════════════════════════════
#
# MACHINE PROFILE — the values below are tuned for THIS machine:
#
#   CPU     : 4 physical cores / 8 logical, single-channel DDR4-2400
#   RAM     : 13.8 GB
#   GPU     : AMD APU (Vega 10 / Raven Ridge, gfx902), Vulkan backend
#   VRAM    : 2 GB carve-out + ~6.9 GB GTT (system RAM addressable by iGPU)
#   OS      : Linux (systemd unit provided separately)
#   Model   : Qwen3-8B Q4_K_M (4.8 GB file)
#   Bench   : 3.06 tok/s at 36-layer offload, 4 threads, FA on
#             (36L/4T/FA=on is fastest; 8L/4T/FA=on was 1.64 tok/s)
#
# MIGRATION GUIDE — for a larger machine, change values marked
#   # [MACHINE-DEPENDENT]
# The tier bracket tells you what to use on which class of hardware:
#   APU-2GB     — this box; carve-out + GTT, 1.0-3.1 tok/s
#   APU-4GB+    — bigger shared-memory APU (Ryzen 7 7840U, etc.)
#   DGPU-8GB    — RTX 3060/4060, RX 6600
#   DGPU-16GB   — RTX 4070 Ti / 4080
#   DGPU-24GB+  — RTX 4090 / A5000 / 3090
#   DGPU-48GB+  — A6000 / L40 / 2×24 GB
#
# Everything NOT marked [MACHINE-DEPENDENT] works identically on every
# machine and should not need editing.
#
# SECRETS CONTRACT — this file is checked into git. NOTHING sensitive
# may live here. The three required secrets come from ${VAR}
# substitution expanded at startup:
#   api.key                → ${LLM_API_KEY}
#   api.master_key         → ${LLM_MASTER_KEY}
#   api.password           → ${LLM_DB_PASSWORD}
#   conversation.password  → ${LLM_DB_PASSWORD}
# systemd supplies them via EnvironmentFile=/etc/local-llm/.env.
#
# KEY STATUS TAGS — used from the NVME KV CACHE section onward. Every key was
# audited against the code (repo Deveeelloopase/Local-LLM, 2026-11-15):
#   [LIVE]      read by the running server — editing it changes behaviour.
#   [RESERVED]  accepted (and sometimes validated) but NO code path reads it in
#               this release — editing it has no effect. Left in place so the
#               schema and your tooling stay compatible; do not rely on it.
# Tier names in the [MACHINE-DEPENDENT] tables: APU-2GB (this box), APU-4GB+,
# DGPU-8GB, DGPU-16GB, DGPU-24GB+, DGPU-48GB+.
# ════════════════════════════════════════════════════════════════════════════════

version: "1.0.0"


# ════════════════════════════════════════════════════════════════════════════════
# 🔋 POWER — Host suspend / idle control
# ════════════════════════════════════════════════════════════════════════════════
power:
  # Hold the host awake while the service runs. On this box a 700 s CLI
  # generation was frozen by the host suspending to RAM; systemd-inhibit
  # prevents that. On any production server this should be true.
  prevent_suspend: true


# ════════════════════════════════════════════════════════════════════════════════
# 🌐 SERVER — Network, CORS, TLS, connection limits
# ════════════════════════════════════════════════════════════════════════════════
server:
  host: "127.0.0.1"
  port: "8080"
  workers: 1
  worker_timeout_s: 120
  max_connections: 1000
  backlog: 2048

  # Body size cap. 4 MB is generous for any realistic chat request
  # (500K-char prompt = 500 KB); prevents a single client exhausting
  # memory before Pydantic validation. Raise only for document-embedding
  # use cases.
  max_body_size_mb: 4
  max_header_size_kb: 8

  # Fail-fast on startup error: raise → uvicorn exits non-zero →
  # systemd restarts. When false, the server stays up with /health
  # returning 200 status=startup_failed and every real endpoint 503s.
  fail_fast_on_startup_error: true

  tls:
    enabled: false
    cert_path: "/etc/ssl/certs/server.crt"
    key_path: "/etc/ssl/private/server.key"

  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
  cors_allow_credentials: true
  cors_expose_headers:
    - "X-Request-ID"
    - "X-RateLimit-Remaining"

  trusted_proxies:
    - "127.0.0.1"


# ════════════════════════════════════════════════════════════════════════════════
# 🔑 API — Authentication, rate limiting, key store
# ════════════════════════════════════════════════════════════════════════════════
api:
  key: "${LLM_API_KEY}"
  master_key: "${LLM_MASTER_KEY}"

  key_store_enabled: true
  storage: "postgresql"

  # Fail-fast on Postgres unavailable. Memory fallback would invalidate
  # all keys on every restart; better to fail and let systemd retry.
  key_store_allow_memory_fallback: false

  key_store_db: "/home/deve-oops/AMB-OPT/local-llm-cloud/tmp/llm_keys.db"
  host: "localhost"
  port: "5432"
  database: "llm_keys"
  username: "amb_llm"
  password: "${LLM_DB_PASSWORD}"

  pool_size: 10
  max_overflow: 5
  pool_timeout: 30
  pool_recycle: 3600

  retry_attempts: 3
  retry_backoff_base: 0.1
  retry_jitter: true
  sqlite_cache_mb: 64

  log_requests: true
  request_log_retention_days: 30
  soft_delete_retention_days: 90
  key_cache_size: 1000
  expected_concurrency: 100
  prune_interval_hours: 1
  batch_usage_updates: false
  usage_batch_interval: 1.0
  usage_batch_size: 100

  ip_rate_limit:
    enabled: true
    rps: 50.0
    capacity: 100.0
    reset_idle_seconds: 5.0
    max_age_seconds: 300.0
    bypass_localhost: true
    adaptive: false
    adaptive_factor: 0.5
    pressure_latency_ms: 200.0
    pressure_queue_depth: 10

  api_key_rate_limit_rps: 100.0
  api_key_rate_limit_capacity: 200.0
  api_key_concurrency_limit: 0
  admin_rate_limit:
    max_requests_per_hour: 1000


# ════════════════════════════════════════════════════════════════════════════════
# 🔧 HARDWARE — GPU detection, preferred backend
# ════════════════════════════════════════════════════════════════════════════════
hardware:
  auto_detect: true
  # [MACHINE-DEPENDENT]
  # APU-2GB / APU-4GB : "hip"    (this box)
  # DGPU-8GB+ (NVIDIA): "cuda"
  # DGPU-16GB+ (AMD)  : "rocm"
  # Any (Vulkan)      : "vulkan"
  # CPU only          : "cpu"
  preferred_backend: "hip"

  # force_backend: uncomment to override auto-detection entirely.
  # Use only when auto-detection reports the wrong backend.
  # force_backend: "rocm"

  detection_timeout_s: 30.0
  cmd_timeout_s: 5

  vulkan_icd_paths:
    - "/usr/share/vulkan/icd.d"
    - "/etc/vulkan/icd.d"
    - "/usr/lib/x86_64-linux-gnu/GL/vulkan/icd.d"
    - "/usr/lib/vulkan/icd.d"
    - "/usr/lib64/vulkan/icd.d"
    - "/run/opengl-driver/share/vulkan/icd.d"

  # Priority order — "hip" is normalised to "rocm" internally.
  backend_order:
    - "cuda"
    - "rocm"
    - "vulkan"
    - "opencl"
    - "mps"
    - "numba"
    - "numpy"
    - "cpu"


# ════════════════════════════════════════════════════════════════════════════════
# 📊 HARDWARE PROFILES — Per-tier inference configuration
# ════════════════════════════════════════════════════════════════════════════════
hardware_profiles:
  force_profile: null

  detection_thresholds:
    apu_4gb_min_mb: 3073
    gpu_4gb_max_mb: 5119
    gpu_6gb_max_mb: 7167
    gpu_8gb_max_mb: 10239
    gpu_12gb_max_mb: 14335
    gpu_16gb_max_mb: 20479

  overrides:
    # ── This machine's tier (apu_2gb) ──────────────────────────────
    apu_2gb:
      # Context floor; the memory planner may raise it up to
      # model_loader.max_context_tokens.
      # [MACHINE-DEPENDENT]
      # APU-2GB  : 4096  (this box — KV dominates GTT budget)
      # APU-4GB+ : 8192
      # DGPU-8GB : 8192
      # DGPU-16GB: 16384
      # DGPU-24GB: 32768
      context_length: 4096

      # n_batch (prefill chunking). Larger = faster prefill, more RAM.
      # [MACHINE-DEPENDENT]
      # APU-2GB  : 2048  (this box)
      # DGPU-8GB+: 2048
      # DGPU-24GB: 4096
      n_batch: 2048

      # Concurrent decodes. MUST be 1 unless the second context can fit
      # alongside the first (see `_check_rebuild_feasible` in
      # batched_engine.py). Attempting higher on tight VRAM causes
      # ggml_abort; the auto-adaptive rebuild guard now refuses
      # cleanly, but the safest setting for APU-2GB is 1.
      # [MACHINE-DEPENDENT]
      # APU-2GB  : 1
      # APU-4GB+ : 1
      # DGPU-8GB : 2
      # DGPU-16GB: 4
      # DGPU-24GB: 8
      # DGPU-48GB: 16
      n_parallel: 1

      # Flash attention. On this Vulkan build FA works and is ~3% faster
      # at 36 layers (bench: 2.97 → 3.06 tok/s). On older llama.cpp
      # Vulkan builds this was false because quantized V cache required
      # FA which wasn't compiled. Verify with `bench_decode.py --flash 1`
      # before changing on a new machine.
      # [MACHINE-DEPENDENT]
      # APU-2GB  : true  (this box)
      # Anything : true  (rebuild-via-bench if unsure)
      flash_attn: true

      # Context/layers tradeoff policy for the offload planner.
      # "layers" spends VRAM on more offloaded layers instead of context.
      # APU-2GB and APU-4GB should use "layers"; discrete GPUs with
      # plenty of VRAM can use "balanced".
      # [MACHINE-DEPENDENT]
      # APU-2GB  : "layers"
      # DGPU-24GB+: "balanced"
      context_vs_layers_priority: "layers"

      # KV-cache type used when a model has no measurement of its own. On
      # Vulkan with this iGPU a quantised cache decodes much more slowly
      # (measured: -42 % on an 8B model, -53 % on a 4B model), so f16 is the
      # default here. Each model is measured at start-up with f16 and q8_0
      # (models.auto.calibration) and the faster type is used for that model;
      # q4_0 saves ~50 % KV memory but lowers output quality and is only used
      # when f16 and q8_0 cannot hold the minimum context.
      # [MACHINE-DEPENDENT]
      # APU-2GB  : "f16"  (this box, Vulkan)
      # DGPU-16GB+: "f16"  (best quality, plenty of VRAM)
      kv_cache_quant: "f16"

      # Speculative decoding. Off by default — requires a draft model
      # that is loaded and autoloaded. The bench file is authoritative
      # for single-user speed; speculative decoding only helps when
      # a draft is running. See `throughput_optimizer` below.
      # [MACHINE-DEPENDENT]
      speculative_decoding: false

      # Pin model weights in RAM. False on this box: mlock would reserve
      # ~4.8 GB of unreclaimable memory on a 13.8 GB host that also runs
      # Postgres + a 2 GB iGPU carve-out, pushing the cgroup over
      # MemoryMax. True on dedicated servers with plenty of RAM.
      # [MACHINE-DEPENDENT]
      # APU-2GB  : false
      # DGPU-24GB: true  (if LimitMEMLOCK=infinity in the unit)
      use_mlock: false

    gpu_8gb:
      n_parallel: 2
    gpu_16gb:
      n_parallel: 4
      context_vs_layers_priority: "balanced"
    gpu_24gb:
      n_parallel: 8
      context_vs_layers_priority: "balanced"
      kv_cache_quant: "f16"
    gpu_48gb:
      n_parallel: 16
      context_vs_layers_priority: "balanced"
      kv_cache_quant: "f16"

  custom_profiles: {}
  # UMA GTT offload. On APUs the iGPU can address system RAM through the
  # Graphics Translation Table (typically 60% of total RAM). Enabling
  # this lets the VRAM budget exceed the carve-out, but on single-channel
  # DDR4 APUs it turns every decode into a bus thrash. Keep false on
  # APU-2GB; consider true on dual-channel APUs where the measured bench
  # shows a win.
  # [MACHINE-DEPENDENT]
  uma_gtt_offload: false


# ════════════════════════════════════════════════════════════════════════════════
# 🖥️ GPU ANALYZER — Compute estimates and thermal limits
# ════════════════════════════════════════════════════════════════════════════════
gpu_analyzer:
  default_fp32_tflops: 10.0
  default_mem_bw_gbps: 200.0
  default_l2_cache_mb: 4.0
  default_pcie_gen: 4
  default_pcie_lanes: 16
  default_pcie_bw_gbps: 16.0
  default_ram_bw_gbps: 50.0
  thermal_throttle_temp_c: 85.0
  cmd_timeout_s: 10
  model_overrides: {}


# ════════════════════════════════════════════════════════════════════════════════
# ⚙️ SYSTEM — OS-level kernel tuning
# ════════════════════════════════════════════════════════════════════════════════
system:
  # MASTER SWITCH for all host mutations (SystemOptimizer + NVMe sysctls +
  # cpu_optimizer kernel module). Default false because two components
  # previously wrote conflicting dirty_ratio / dirty_bytes sysctls, and
  # cpu_optimizer tried to make/insmod a kernel module that failed every
  # boot. Re-enable only after resolving the conflict — see the
  # "Recommended operator settings" block below for the safer alternative
  # (apply via /etc/sysctl.d, not via this process).
  allow_kernel_tuning: false
  venv_path: "/home/deve-oops/DEVE-BOX"

  # ── Recommended operator settings (apply ONCE on the host) ────────
  # /etc/sysctl.d/90-local-llm.conf:
  #   vm.swappiness = 10
  #   vm.vfs_cache_pressure = 50
  #   vm.overcommit_memory = 1
  #   vm.dirty_ratio = 20                    # choose ratio OR bytes
  #   vm.dirty_background_ratio = 5          # never both
  #   kernel.numa_balancing = 0
  # For CPU governor + I/O scheduler on the model's NVMe:
  #   systemctl enable --now tuned  (custom profile)
  #   or udev rule: ACTION=="add|change", KERNEL=="nvme0n1", ATTR{queue/scheduler}="mq-deadline"
  # ────────────────────────────────────────────────────────────────

  enable_huge_pages: false
  huge_pages:
    auto_pct: 12.0
    min_pages: 64
    max_pages: 512
    warn_threshold_pct: 15.0
    info_threshold_pct: 10.0

  enable_thp: false
  thp_mode: "madvise"

  enable_cpu_governor: false
  cpu_governor: "performance"

  enable_io_scheduler: false
  io_scheduler: "mq-deadline"

  enable_memlock: false

  enable_vm_tune: false
  vm:
    swappiness: 10
    dirty_ratio: 40
    dirty_background_ratio: 5
    vfs_cache_pressure: 50
    overcommit_memory: 1

  cpu_optimizer:
    enabled: false
    core_mask: ""


# ════════════════════════════════════════════════════════════════════════════════
# 🚄 KERNELS — Custom accelerator backends
# ════════════════════════════════════════════════════════════════════════════════
kernels:
  # Patches PyTorch ops with custom HIP/CUDA kernels. The GGUF
  # (llama.cpp) path does not use PyTorch at all, so this is dead code
  # on every GGUF deployment. Leave off unless you run the
  # transformers/HF path and have benchmarked a win.
  # [MACHINE-DEPENDENT — always false for GGUF]
  enabled: false
  auto_select: true
  force_backend: null
  cpu_optimizer:
    enabled: false
    core_mask: ""


# ════════════════════════════════════════════════════════════════════════════════
# 🧠 MEMORY — VRAM, RAM, SSD swap, hybrid caching
# ════════════════════════════════════════════════════════════════════════════════
memory:
  # VRAM target utilisation of the carve-out (not GTT). 0.95 is right
  # for both APU (tight) and dGPU (headroom).
  # [PORTABLE]
  vram_utilization_target: 0.95

  # Canonical RAM budget (fraction of total). 0.75 on this box leaves
  # headroom for Postgres + iGPU carve-out. Raise on dedicated servers.
  # [MACHINE-DEPENDENT]
  # APU-2GB  : 0.75  (this box)
  # DGPU-16GB: 0.80
  # DGPU-48GB: 0.90
  ram_utilization_target: 0.75

  compression_enabled: true
  ssd_swap_path: "/var/lib/local-llm/swap"
  ssd_swap_max_gb: 32
  gc_interval_s: 60.0
  gc_on_memory_pressure: true

  vram:
    vram_target_utilization: 0.95
    vram_defrag_threshold: null
    vram_history_window: 256
    vram_prefetch_alpha: 0.1
    vram_defrag_check_interval_s: 60.0
    vram_allocation_retries: 3

  ram:
    ram_max_mb: 0
    ram_compress_ratio_threshold: 0.85
    ram_max_mmaps: 64
    ram_max_prefetch_concurrent: 16

  swap:
    ssd_swap_path: "/var/lib/local-llm/swap"
    ssd_swap_max_gb: 32.0
    ssd_compression_enabled: true
    ssd_compression_level: 0

  hybrid:
    ssd_path: "/var/lib/local-llm/hybrid"
    ssd_max_gb: 20.0
    compression_enabled: true
    promotion_threshold: 0.95

  hybrid_cache:
    ram_budget_mb: 512
    nvme_budget_mb: 5000
    promote_threshold_per_min: 2.0
    demote_threshold_per_min: 0.5
    rebalance_interval_s: 60.0
    ram_pressure_threshold: 0.90
    ewma_alpha: 0.1

  sqlite:
    db_path: "/home/deve-oops/AMB-OPT/local-llm-cloud/tmp/llm_keys.db"
    max_connections: 10
    connection_timeout_s: 5.0


# ════════════════════════════════════════════════════════════════════════════════
# 🔀 CONCURRENCY — Pool vs single-process mode
# ════════════════════════════════════════════════════════════════════════════════
concurrency:
  # Modes:
  #   single_process — one in-process engine. REQUIRED for continuous
  #                    batching. Use this on any single-GPU machine
  #                    where you want multi-user throughput.
  #   process_pool   — N worker subprocesses, one request per worker.
  #                    Only makes sense on multi-GPU or memory-isolated
  #                    deployments. Not for single-GPU scale.
  #   micro_batch    — reserved; falls through to single_process.
  # [MACHINE-DEPENDENT]
  # APU-2GB  : single_process (with continuous_batching enabled below)
  # DGPU-24GB: single_process (with n_seq_max raised)
  # Multi-GPU: process_pool
  mode: "single_process"

  # initial_workers / max_workers only matter in process_pool mode.
  # 0 = MemoryLedger decides from RAM + bandwidth + cores.
  initial_workers: 0
  max_workers: 0

  # Heartbeat protocol (pool mode). Interval must be < timeout; 3×
  # minimum recommended. Previous 0.5s/5s caused 27 kills in 19 min
  # because no worker emitted any heartbeat at all.
  heartbeat_s: 1.0
  heartbeat_timeout_s: 15.0

  # Respawn backoff (pool mode). Resets only after stable_after_s health.
  respawn_backoff: [1, 2, 4, 8, 30]
  max_respawns_per_5min: 3

  global_queue_max: 256
  ram_refuse_pct: 90
  target_min_tps_per_worker: 1.0
  os_reserve_mb: 1024
  runtime_per_worker_mb: 300
  affinity_prefix_weight: 1.0
  affinity_thermal_weight: 0.5
  affinity_staleness_weight: 1.0
  throttle_start_c: 85.0
  micro_batch_enabled: false


# ════════════════════════════════════════════════════════════════════════════════
# 🚀 INFERENCE — Generation parameters, timeouts, continuous batching
# ════════════════════════════════════════════════════════════════════════════════
inference:
  batch_size: 1
  default_temperature: 0.7
  default_top_p: 0.95
  default_top_k: 40

  # Generation policy. 0 = unlimited; engine slides its own context
  # when approaching n_ctx. Positive = exact cap.
  # [PORTABLE]
  default_max_tokens: 0
  long_request_threshold_tokens: -1
  default_stop: []
  segment_size: 512
  max_segments: 0
  health_check_interval_segments: 1

  # ── Streaming / heartbeat ──────────────────────────────────────
  chunked_prefill: true
  heartbeat_interval_s: 5.0
  chunked_prefill_min_tokens: 256
  chunked_prefill_chunk_min: 16
  chunked_prefill_chunk_max: 256
  chunked_prefill_chunk_seconds: 3.0

  # Anti-repetition sampling (only applied when temperature > 0)
  presence_penalty: 1.0
  frequency_penalty: 0.2
  repeat_penalty: 1.05
  penalty_apply_only_when_sampling: true

  # Loop guards — terminate degenerate repetition / self-Q&A
  loop_guard_enabled: true
  loop_guard_min_cover: 800
  loop_guard_window: 8000
  loop_guard_check_every: 48
  loop_guard_line_min_chars: 40
  loop_guard_line_repeats: 3
  loop_guard_heading_min_chars: 12
  loop_guard_heading_repeats: 3
  loop_guard_shingle_n: 8
  loop_guard_shingle_window: 6000
  loop_guard_shingle_ratio: 0.45
  loop_guard_shingle_min_words: 600

  solicitation_guard_enabled: true
  solicitation_grace_tokens: 64
  solicitation_min_arm_tokens: 256
  solicitation_families: []

  # Hard ceiling on generated tokens per request regardless of what
  # the client asks for. 16384 = 2× the model's 8K window (safe).
  # [PORTABLE]
  max_total_tokens: 16384

  # Streaming timeouts
  first_token_timeout_floor_s: 120.0
  first_token_timeout_multiplier: 3.0
  inter_token_stall_s: 60.0
  prefill_ewma_alpha: 0.05
  min_response_tokens: 64

  # default_timeout_s: 3600 = 1 hour wall clock per request. Prevents
  # a single request from holding the inference slot for hours.
  # [PORTABLE]
  default_timeout_s: 3600

  suppress_thinking: true
  reasoning_budget_tokens: 4000
  thinking_indicator_enabled: true

  # AIMD target concurrency. Set to the measured decode rate from
  # /var/lib/local-llm/bench_decode.json. On this box, 3.06 tok/s.
  # [MACHINE-DEPENDENT — set from bench_decode.py]
  # APU-2GB  : 3.06
  # DGPU-24GB: 60.0 to 90.0
  aimd_target_tps: 3.06
  aimd_min_batch: 1
  aimd_max_batch: 4
  aimd_adjust_interval_s: 5.0
  max_concurrent_requests: 4

  # Engine internals
  max_batch_size: 4
  target_tps: 3.06
  rate_limit_rps: 100.0
  rate_limit_max_keys: 1000
  context_safety_tokens: 256
  circuit_breaker_failure_threshold: 5
  circuit_breaker_recovery_s: 60.0
  autotune_interval_s: 300.0
  min_executor_workers: 1
  executor_max_queue: 64
  metrics_history_size: 500
  context_cache_bytes: 268435456
  context_cache_prefix_len: 512
  ngram_n: 4
  ngram_max_size: 50000
  request_queue_maxsize: 2000

  # Throughput optimizer (speculative decoding)
  # Requires a draft model loaded and autoloaded.
  # [MACHINE-DEPENDENT]
  # APU-2GB  : false (no draft model present)
  # DGPU-16GB: true  (Qwen3-0.6B draft, expect 1.5-2× on code)
  throughput_optimizer: false
  draft_model_id: "qwen3-0.6b"
  target_model_id: "qwen3-8b"
  spec_k: 8
  kv_cache_max_gb: 10.0

  # ═════════════════════════════════════════════════════════════════
  # CONTINUOUS BATCHING — token-level multi-sequence decode
  # ═════════════════════════════════════════════════════════════════
  # One Llama instance decodes N concurrent sequences per forward
  # pass. Aggregate throughput scales roughly linearly with n_seq_max
  # until memory bandwidth saturates.
  #
  # REQUIRES concurrency.mode: single_process (above).
  # Requires llama-cpp-python ≥ 0.3.20 with LlamaContext.decode().
  # Verified on 0.3.36.
  #
  # Setting enabled: true is SAFE on any machine with the auto-
  # adaptive rebuild guard in batched_engine.py: if the second
  # context cannot fit, `_check_rebuild_feasible` refuses and the
  # engine falls back to single-sequence cleanly. No crash.
  continuous_batching:
    enabled: true
    prefix_reuse: true      # KV prefix reuse between turns; set false to restore the old behaviour exactly


    # n_seq_max: concurrent sequences.
    #
    # On this box: MUST stay at 1. The rebuild feasibility check
    # will refuse anything higher (2 GB carve-out + 6.9 GB GTT minus
    # 4.8 GB model leaves insufficient room for a second context).
    # Setting it to 1 keeps the batched code path exercised with no
    # rebuild required (early-return in _rebuild_context).
    #
    # [MACHINE-DEPENDENT]
    # [AUTO] "auto" (default) derives the slot count at startup from the
    # model size, free RAM, context length and CPU cores
    # (local_llm_core/accel/seq_planner.py). Put an integer here to pin it.
    # Optional tuning keys: planning_ctx, min_ctx_per_seq (1024),
    # per_seq_overhead_mb (64), os_reserve_mb (1024), adaptive_max_n_seq_max (8).
    n_seq_max: auto

    # kv_unified: shared KV pool across sequences. Required for chat
    # (variable-length replies). True on every machine.
    kv_unified: true

    # Prefill chunk size. null = auto-derive from n_batch / n_seq_max.
    # 128 is a good default for chat.
    prefill_chunk_size: null

    # Per-stream stall detector. Fail the stream if no token arrives
    # for this long. Independent of generation timeout.
    # [PORTABLE]
    inter_token_stall_s: 120.0

    # Prefix cache (KV snapshots for repeated system prompts). When
    # enabled, reserves 2 extra seq slots and copies KV state on
    # prompt-prefix match. Cuts a 454-token system prompt prefill from
    # ~116 s to <500 ms on this hardware. On tight VRAM, the +2
    # reserved slots may force a context rebuild; the feasibility
    # guard catches that, but staying at false avoids the attempt.
    # [MACHINE-DEPENDENT]
    # APU-2GB  : false  (this box — rebuild unsafe with +2 slots)
    # APU-4GB+ : false
    # DGPU-8GB+: true   (large win for chat, cheap on big VRAM)
    pf_enabled: false

    # Adaptive controller. Grows n_seq_max toward max when TTFT is
    # well under target; shrinks when throttled or TTFT exceeds
    # target. Cannot grow beyond initial n_seq_max (the context
    # was sized for it at construction).
    adaptive_n_seq_max: true
    adaptive_target_ttft_ms: 5000
    adaptive_min_n_seq_max: 1
    adaptive_max_n_seq_max: null
    adaptive_check_interval_s: 60.0
    thermal_override_enabled: true

    # BitNet-specific (informational; bitnet.enabled is off below)
    bitnet:
      adaptive_timeouts: true
      calibration_tokens: 2
      logit_clip_sigma: 5.0
      softmax_floor: 1.0e-9


# ════════════════════════════════════════════════════════════════════════════════
# 📄 OUTPUT — Response formatting (client-side)
# ════════════════════════════════════════════════════════════════════════════════
output:
  # Collapse 3+ blank lines to 2 in streamed replies (StreamCompactor).
  # Applies in the CLI and Web UI. Set false for whitespace-sensitive
  # output.
  compact_whitespace: true


# ════════════════════════════════════════════════════════════════════════════════
# 📋 SCHEDULER — Request queuing, AIMD, fairness
# ════════════════════════════════════════════════════════════════════════════════
scheduler:
  aimd_target_tps: 3.06
  aimd_min_batch: 1
  aimd_max_batch: 4
  aimd_interval_s: 5.0
  aimd_hysteresis: 2
  aimd_high_margin: 0.95
  aimd_low_margin: 0.85
  max_queue_per_priority: 64
  max_total_queue: 256
  default_timeout_s: 720.0
  prune_interval_s: 10.0

  fairness_weights:
    low: 1
    normal: 2
    high: 4
    urgent: 8

  preemption:
    persist_dir: null


# ════════════════════════════════════════════════════════════════════════════════
# 💾 DRIVE PIPELINE — NVMe accelerators
# ════════════════════════════════════════════════════════════════════════════════
drive_pipeline:
  target_vram_pct: 0.95
  target_ram_pct: 0.75
  target_tps: 3.06
  cpu_thread_ratio: 0.5
  use_madvise: true
  use_direct_io: false
  model_dir: "/home/deve-oops/models"
  swap_dir: "/var/lib/local-llm/llm_swap"
  cpu_thread_limit: 0

  context_cache:
    max_bytes: 268435456
    prefix_len: 512

  layer_prefetcher:
    prefetch_depth: 3
    max_cache_bytes: 2147483648
    max_workers: 2

  cpu_throttler:
    # Match apu_2gb profile: use all 4 physical cores.
    # [MACHINE-DEPENDENT]
    # APU-2GB  : 1.0  (this box, 4 cores)
    # DGPU-24GB+: 0.75 to 0.85  (leave headroom for GPU driver)
    thread_ratio: 1.0
    thread_limit: 0

  concurrency:
    initial_capacity: 1

  throughput_controller:
    target_tps: 3.06
    min_batch: 1
    max_batch: 32
    window_sec: 300.0

  nvme_advisor:
    ram_threshold: 0.70

  memory_pressure:
    vram_target_pct: 0.95
    ram_target_pct: 0.75

  sysctl:
    dirty_bytes: 268435456
    dirty_background_bytes: 67108864
    vfs_cache_pressure: 50
    numa_balancing: 0


# ════════════════════════════════════════════════════════════════════════════════
# 🔀 LAYER STREAMER — Fractional layer pipeline / OOM recovery
# ════════════════════════════════════════════════════════════════════════════════
layer_streamer:
  vram_overhead_mb: 80
  layer_overcommit_factor: 1.05
  oom_max_attempts: 5
  oom_layer_reduction_factor: 0.75
  ctx_reduction_steps: [1, 2, 4]
  min_context: 256
  last_n_tokens_size: 2048

  # Prompt-lookup speculative decoding (no draft model needed).
  # Zero extra memory. Best for agent/tool-call workloads. Disable
  # for pure creative prose.
  # [MACHINE-DEPENDENT — workload-specific]
  prompt_lookup_enabled: false
  prompt_lookup_num_tokens: 2


# ════════════════════════════════════════════════════════════════════════════════
# ⚡ THROUGHPUT OPTIMIZER — Speculative decoding orchestrator
# ════════════════════════════════════════════════════════════════════════════════
# SINGLE AUTHORITATIVE SWITCH. Must match inference.throughput_optimizer.
# Both are kept for schema backward compat.
# NOTE (verified in api_server.py): the switch the server actually tests is
# inference.throughput_optimizer. It also needs inference.draft_model_id to be
# autoloaded and present on disk, and concurrency.mode != process_pool. This
# top-level section is not read by the server — keep both false on this box.
# [MACHINE-DEPENDENT — set from bench]
# APU-2GB  : false
# DGPU-16GB: true (requires draft model loaded)
throughput_optimizer:
  enabled: false
  max_batch_slots: 8
  queue_depth: 64
  kv_cache_priority_boost_enabled: true
  kv_cache_priority_boost: 10

# ════════════════════════════════════════════════════════════════════════════════
# 💡 NVME KV CACHE — Persistent prompt-prefix cache
# ════════════════════════════════════════════════════════════════════════════════
# Passed to: NVMeKVCache(config=cfg["nvme_kv_cache"])
#
# [RESERVED in the server] — api_server.py never reads this section. When it
# builds the ThroughputOptimizer (only if inference.throughput_optimizer is
# true AND the draft model is autoloaded + on disk AND the pool is off) it
# passes the legacy kwargs instead:
#     dir          = <memory.ssd_swap_path>/kv_cache   → /var/lib/local-llm/swap/kv_cache
#     max_size_gb  = inference.kv_cache_max_gb         → 10.0
# So the values below only take effect if you call NVMeKVCache(config=...)
# yourself. They are kept in step with the live ones (same 10 GB / 512) so
# wiring the section in later changes nothing but the directory.
#
# Safe-by-design: a bad value falls back to the schema defaults
# (/tmp/llm_kv_cache), and a directory that cannot be created DISABLES the
# cache with a warning — it never stops the server from starting.
#
# What it stores: one KV snapshot per distinct 512-token prompt prefix, so a
# repeated system prompt is restored from disk instead of re-prefilled.
# Size per entry for Qwen3-8B (36 layers, 8 KV heads, head_dim 128):
#   f16 KV  ≈ 72 MiB      q8_0 KV ≈ 38 MiB   → 10 GB holds ≈ 140-270 entries.
nvme_kv_cache:
  # [PORTABLE] — the cache is inert until the ThroughputOptimizer is on.
  enabled: true

  # Must be on a writable path. Under systemd that means a ReadWritePaths= /
  # StateDirectory= target (the unit grants /var/lib/local-llm).
  # [MACHINE-DEPENDENT]
  # APU-2GB  : "/var/lib/local-llm/kv_cache"  (this box)
  # Any NVMe : a directory on the NVMe, NOT on a network or spinning disk
  #            (restoring a snapshot must beat re-computing the prefill)
  dir: "/var/lib/local-llm/kv_cache"

  # Disk budget; LRU-evicts when exceeded. Schema minimum 0.1. Keep it to
  # ≤ 25% of the volume's free space.
  # [MACHINE-DEPENDENT]
  # APU-2GB  : 10.0  (this box)
  # DGPU-8GB : 20.0
  # DGPU-24GB+: 50.0
  max_size_gb: 10.0

  max_entries: 0                       # 0 = unlimited (size cap still applies)

  # Prompt-prefix length that forms the cache key. Schema minimum 64. Keep
  # equal to inference.context_cache_prefix_len and
  # drive_pipeline.context_cache.prefix_len (all 512).
  # [PORTABLE]
  prefix_len: 512


# ════════════════════════════════════════════════════════════════════════════════
# 🔮 SPECULATIVE DECODING — Draft + target model acceleration
# ════════════════════════════════════════════════════════════════════════════════
# Passed to: SpeculativeEngine(config=cfg["speculative"])
#
# [RESERVED in the server] — like nvme_kv_cache, this section is only used
# when ThroughputOptimizer / SpeculativeEngine is built with config=...; the
# server's own gate is inference.throughput_optimizer (+ inference.spec_k,
# inference.draft_model_id, inference.target_model_id). Keep both places
# identical so there is one story.
#
# Validated at construction (a violation raises, it does not fall back):
#   1 ≤ k ≤ 32,  min_k ≤ k ≤ max_k,  0 ≤ top_p ≤ 1,
#   draft_timeout_s ≥ 1,  verify_timeout_s ≥ 1,  max_fallback_retries ≥ 1.
#
# How it works: the draft model proposes k tokens, the target verifies all k
# in ONE forward pass (weights are read once, not k times — which is why it
# helps bandwidth-bound decode). adaptive_k raises k while the acceptance
# rate stays ≥ acceptance_target_high and lowers it below
# acceptance_target_low.
#
# Why OFF on this box: no draft file is downloaded, and the draft weights
# (~0.6 GB) plus a second context would have to share the same ~6.9 GB GTT
# budget the 36-layer offload already fills. Turn on only after
# tools/bench_decode.py shows a reproducible win on the exact hardware.
# Draft and target MUST share a tokenizer/vocabulary (Qwen3-0.6B ↔ Qwen3-8B
# both 151936 — that is what vocab_size records).
speculative:
  # [MACHINE-DEPENDENT]
  # APU-2GB  : false  (this box)
  # APU-4GB+ : false  (until benchmarked)
  # DGPU-16GB+: true  (Qwen3-0.6B draft; ~1.5-2x on code/structured output)
  enabled: false

  # Both must exist in models.profiles. The draft must carry the "draft" tag
  # (that hides it from /v1/models and loads it after the primary models).
  draft_model_id: "qwen3-0.6b"
  target_model_id: "qwen3-8b"

  # Tokens proposed per step. Larger = bigger win when acceptance is high,
  # more wasted draft work when it is low.
  # [MACHINE-DEPENDENT]
  # APU/bandwidth-bound: 4-8      DGPU: 8      code-heavy: up to 16
  k: 8
  min_k: 3
  max_k: 16
  adaptive_k: true
  top_p: 0.9
  acceptance_target_high: 0.75         # raise k above this acceptance rate
  acceptance_target_low: 0.50          # lower k below this acceptance rate
  draft_timeout_s: 30.0
  verify_timeout_s: 60.0
  max_fallback_retries: 5              # failures before dropping to plain decode
  enable_exact_verification: false     # true = bit-exact vs target-only sampling (slower)

  # draft_repo / draft_filename / draft_size_mb are [RESERVED]: nothing in the
  # code downloads the draft or reads these. They document which file to put
  # at models.profiles[qwen3-0.6b].path:
  #   huggingface-cli download Qwen/Qwen3-0.6B-GGUF Qwen3-0.6B-Q8_0.gguf \
  #       --local-dir /home/deve-oops/models
  draft_repo: "Qwen/Qwen3-0.6B-GGUF"
  draft_filename: "Qwen3-0.6B-Q8_0.gguf"
  draft_size_mb: 310                   # informational; the Q8_0 file is ≈ 0.6 GB on disk
  vocab_size: 151936


# ════════════════════════════════════════════════════════════════════════════════
# 🖥️ MULTI-GPU — Tensor parallelism
# ════════════════════════════════════════════════════════════════════════════════
# Passed to: TensorParallel(config=cfg["multi_gpu"])
#
# [RESERVED in the server] — nothing in local_llm_server calls the split
# planner (tensor_parallel.compute_tensor_split / should_split), so this
# whole section is inert and `enabled: true` is harmless: this box has one
# iGPU and nothing to split.
#
# The LIVE multi-GPU control is per model: models.profiles[].gpu_split
# (a list of proportions, e.g. [3, 1] for a 24 GB + 8 GB pair), read by
# model_loader.py and handed to llama.cpp as tensor_split.
#
# Validated when the planner is used: strategy ∈ {auto, even, manual,
# disabled}; manual_ratios all > 0; min_free_vram_mb ≥ 0;
# 0 ≤ bandwidth_weight ≤ 1.
#
# [MACHINE-DEPENDENT]
# APU-2GB / any single GPU : irrelevant (leave as is)
# Identical GPUs           : strategy "even"
# Mixed GPUs               : strategy "auto" (or "manual" + manual_ratios)
multi_gpu:
  enabled: true
  strategy: "auto"                     # auto | even | manual | disabled
  manual_ratios: null                  # e.g. [3, 1]; only used when strategy = manual
  exclude_gpu_ids: []                  # e.g. [0] to keep the display GPU free
  min_free_vram_mb: 512                # a GPU with less free VRAM is skipped
  bandwidth_weight: 0.5                # 0 = split by VRAM only, 1 = by bandwidth only


# ════════════════════════════════════════════════════════════════════════════════
# 🤖 MODELS — GGUF and BitNet profiles, autoloading, security
# ════════════════════════════════════════════════════════════════════════════════
# Passed to: ModelLoader(config=cfg) and BitNetLoader(config=cfg["models"])
#
# ── Per-profile field reference (every key under models.profiles[]) ─────────
#   id                  unique name used in API requests and in other config
#                       sections (draft_model_id, bitnet.default_model_id …).
#   path                absolute path to the .gguf file (or BitNet model dir).
#                       Must be inside models.allowed_dir. Not empty.
#   format              "gguf" | "bitnet".
#   description         shown in /v1/models and the TUI.
#   autoload            true = loaded at startup. A profile that is NOT
#                       autoloaded can still be loaded on demand.
#   model_type          informational. Routing is decided from the GGUF's real
#                       quantization (classify_gguf), not from this field.
#   quantization        label ("Q4_K_M", "Q8_0", "1bit"); used for display and
#                       VRAM planning.
#   context_length      0 = let the context planner decide (model_loader.*);
#                       N > 0 = use exactly N, planner bypassed.
#   num_gpu_layers      -1 = every layer on the GPU, 0 = CPU only, N = N layers.
#   n_threads           0 = auto-detect. Set to PHYSICAL cores on CPU/APU boxes
#                       (SMT threads fight over memory bandwidth and slow
#                       decode down).
#   use_mlock           pin weights in RAM (see hardware_profiles note).
#   rope_scaling        > 0; 1.0 = no scaling.
#   gpu_split           null, or per-GPU proportions e.g. [3, 1].
#   priority            ≥ 0. Higher loads FIRST at startup.
#   ram_required_mb     RAM this model counts against the STARTUP autoload
#                       budget. Profiles are taken in priority order and one is
#                       skipped ("Autoload skip … need N MB") when the running
#                       total would exceed the usable RAM. Omitted = the GGUF
#                       file size. Use the real file size + ~10%.
#   suppress_thinking   null = no per-model override (inference.suppress_thinking
#                       applies); true/false overrides it for this model.
#   tags                "draft" = hidden from /v1/models and loaded after the
#                       primary models. Other tags are labels.
#   tokenizer_path, prompt_format, device, use_flash_attention_2
#                       BitNet profiles only (see the bitnet-* profiles).
models:
  # Sandbox for model files. Any load request whose path resolves (symlinks
  # included) outside this directory is refused with 403, and startup warns if
  # it is missing or unreadable. Must not be empty.
  # [MACHINE-DEPENDENT]
  # this box : "/home/deve-oops/models"
  # server   : "/var/lib/local-llm/models" or "/srv/models"
  allowed_dir: "/home/deve-oops/models"

  # true = load EVERY profile whose file exists. Never on this box: the 8B
  # alone fills the memory budget. Leave false and mark autoload per profile.
  autoload_all: false

  # Give up waiting for one autoload after this long (schema minimum 30).
  # [MACHINE-DEPENDENT]
  # APU-2GB (SATA/slow NVMe): 900.0  (this box)
  # DGPU + fast NVMe        : 300.0
  autoload_timeout_s: 900.0

  # Warm-up generation after each load: pays the one-time Vulkan/CUDA
  # pipeline compile and page-faults the weights before the first real
  # request. warmup_tokens ≥ 1.
  # [PORTABLE]
  warmup_enabled: true
  warmup_prompt: "Hello"
  warmup_tokens: 10

  # warmup_timeout_s and cache_loaded_models are [RESERVED]: validated by the
  # schema but not read by any code. Harmless; leave as is.

  warmup_timeout_s: 30.0
  cache_loaded_models: true

  # ── Automatic model configuration ───────────────────────────────────────
  # At every start the server reads each model's GGUF header and the hardware
  # and fills in every profile field that is left out below: id, format,
  # model_type, quantization, description, context_length, num_gpu_layers,
  # n_threads, use_mlock, rope_scaling, gpu_split, priority, ram_required_mb,
  # suppress_thinking and tags. A value written in a profile always wins.
  # Omitted, null, "auto", 0 (context_length / n_threads / ram_required_mb)
  # and -1 (num_gpu_layers) mean "derive". num_gpu_layers: 0 means CPU only.
  #
  # The computed profiles are written to model_profiles.json in the state
  # directory; `llm-server autoconfig` shows them and explains each value.
  # [PORTABLE]
  auto:
    enabled: true            # false = use profiles exactly as written
    discover: true           # add any unconfigured *.gguf found in allowed_dir
                             # (loadable on demand, never autoloaded)
    max_autoload: 3          # models kept resident together, if memory allows
    kv_cache_quant: auto     # auto | f16 | q8_0 | q4_0 (auto = measured per model)
    device: auto             # auto = best fit | cpu = no GPU | gpu = every layer on GPU | hybrid = split
    gpu_layers: 0            # hybrid only: layers to put on the GPU (0 = auto-fit the maximum)
    ram_reserve_mb: 0        # 0 = derived from the machine
    context_cap: 32768       # context ceiling when model_loader.max_context_tokens is 0
    calibration:
      mode: startup          # startup = measure resident models that have no
                             #           current benchmark, then continue booting
                             # off     = never measure (use the bandwidth estimate)
      scope: autoload        # autoload | all | none
      budget_s: 900          # wall-clock budget per start; unfinished models
                             # are measured on the next start
      variant_timeout_s: 420 # limit for one configuration

  # Profiles need only what cannot be read from the file: the path, whether to
  # autoload, and optional tags/priority. Everything else is derived.
  profiles:
    # ── IBM Granite 4.2 8B ─────────────────────────────────────────────────
    # Layer count, KV layout (hybrid: few attention layers), context, RAM and
    # description are read from the GGUF header.
    - id: "granite-4.2-8b"
      path: "/home/deve-oops/models/granite-4.2-8b-Q4_K_M.gguf"
      autoload: false

    # ── Qwen3 8B — primary model ───────────────────────────────────────────
    - id: "qwen3-8b"
      path: "/home/deve-oops/models/Qwen3-8B-Q4_K_M.gguf"
      autoload: false

    # ── Qwen3 4B — alternate model ─────────────────────────────────────────
    - id: "qwen3-4b"
      path: "/home/deve-oops/models/Qwen3-4B-Q4_K_M.gguf"
      autoload: true

    # ── Qwen3 0.6B — draft model for speculative decoding ──────────────────
    # The "draft" tag is never derived; keep it explicit. Download the file
    # before enabling autoload.
    - id: "qwen3-0.6b"
      path: "/home/deve-oops/models/Qwen3-0.6B-Q8_0.gguf"
      autoload: false
      tags: ["draft", "fast"]

    # ── BitNet GGUF (pre-converted i2_s) — bitnet.cpp path, fastest ────────
    # This file already exists at /home/deve-oops/models/ — RAM usage



# ════════════════════════════════════════════════════════════════════════════════
# 🏗️ MODEL LOADER — VRAM budget, timeouts, circuit breaker
# ════════════════════════════════════════════════════════════════════════════════
# Passed to: ModelLoader(config=cfg) — reads cfg["model_loader"]
#
# [LIVE] every key. NOTE: pool workers get this section through the load spec;
# if it were ever missing the loader logs a warning and falls back to
# desktop-GPU defaults (safety 500 / runtime 300 / prompt 100 MB), which are
# far too large for a 2 GB carve-out. Do not delete the section.
model_loader:
  # How long a request waits for ANOTHER request's in-flight load of the same
  # model before giving up.
  # [MACHINE-DEPENDENT]
  # APU-2GB (HDD/SATA/slow NVMe): 600.0  (this box)
  # DGPU + fast NVMe            : 180.0
  load_timeout_s: 600.0

  # Time ModelLoader.shutdown() allows for unloading every model when the
  # server stops. Keep it well below the drain window (--drain-timeout 120 /
  # TimeoutStopSec=150 in the systemd unit). [PORTABLE]
  shutdown_timeout_s: 10.0

  # Minimum free VRAM required to attempt a GPU load. Below it the load is
  # refused up front with "Insufficient VRAM: available X MB < minimum Y MB"
  # instead of crashing inside llama.cpp.
  # [MACHINE-DEPENDENT]
  # APU-2GB  : 100  (this box)
  # DGPU-8GB+: 256
  min_vram_budget_mb: 100

  # ── Async weight prefetch (madvise WILLNEED) ────────────────────────
  # Background thread that runs madvise(WILLNEED) on layer byte ranges
  # estimated from the GGUF file size. On this box (shared-memory APU,
  # single-channel DDR4-2400, Vulkan offload) the madvise hints compete
  # with the decode stream for memory bandwidth, which is exactly what
  # decode is bound by, and cannot reduce page faults in any measurable
  # way because there is no signal from llama.cpp about which layer is
  # being read at any moment.
  #
  # Measured baseline before this switch existed: paging activity in the
  # 3-5 s window around each token prefetch burst, no reduction in page
  # faults, decode unchanged at 3.06 tok/s but with more variance.
  #
  # Leave false on bandwidth-bound hardware. Set true only after running
  # tools/bench_decode.py three times with the switch on and three times
  # off on the exact target hardware, and confirming a reproducible win.
  # (The loader's own default is false when this key is absent.)
  # [MACHINE-DEPENDENT]
  # APU-2GB / any shared-memory APU: false  (this box)
  # DGPU with models >> VRAM       : bench it; otherwise false
  async_weight_pipeline_enabled: false

  # ── Context-size planner ─────────────────────────────────────────────
  # The loader sizes n_ctx from real GGUF metadata (n_layer, n_kv_heads,
  # head_dim, head_dim_v) × the KV quantization × a RAM budget, capped by
  # the model's trained window. Per-model override: a profile with
  # context_length > 0 skips the planner entirely.
  #
  #   n_ctx = largest 256-aligned value that fits the KV budget,
  #           never below max(profile context_length, min_context_tokens),
  #           never above max_context_tokens (0 = the trained window).
  #
  # kv_ram_share: fraction of *available* system RAM the KV cache may use.
  #   0.35 works well on a 6 GB-free APU (≈ 2.1 GB → ~27 K tokens of q8_0 KV
  #   for Qwen3-8B, so on this box the CEILING below binds first, not RAM).
  #   Lower it (0.20) if weights fight for RAM; raise it (0.50) where KV
  #   dominates.
  # [PORTABLE]
  kv_ram_share: 0.35

  # min_context_tokens: hard floor. The planner never returns less than this
  # even when RAM is tight. The hardware profile's own context_length also
  # serves as a floor via max(profile_ctx, this).
  # [MACHINE-DEPENDENT]
  # APU-2GB  : 4096  (this box)
  # DGPU-8GB+: 4096-8192
  min_context_tokens: 4096

  # max_context_tokens: hard ceiling for the context planner.
  # 0 = unbounded → the model's trained window (40960 for Qwen3-8B — see
  # the load log: `chosen=40960 (mc.context_length=0)`). On this 4C/8T box
  # with ~5 tok/s prefill, 40960 tokens of prefill takes hours per fresh
  # prompt — unusable in practice. 8192 caps that at ~25 min worst-case
  # while still allowing long conversations. Raise only after measuring
  # higher prefill throughput on this hardware.
  #
  # THE TRADE-OFF ON THIS BOX (bench_decode.py):
  #   8192 ctx @  8 GPU layers → 1.64 tok/s   (KV eats the GTT budget)
  #   4096 ctx @ 36 GPU layers → 3.06 tok/s   (full offload)  ← chosen
  # Floor = ceiling = 4096 here, so the planner is effectively pinned.
  # [MACHINE-DEPENDENT]
  # APU-2GB  : 4096  (this box)
  # APU-4GB+ : 8192
  # DGPU-8GB : 8192
  # DGPU-16GB: 16384-32768
  # DGPU-24GB+: 0 (trained window) once prefill speed is measured
  max_context_tokens: 4096 # 0 unlimited (you'll have to choose: 8192 ctx @ ~8 layers (1.6 tok/s) or 4096 ctx @ 36 layers (3.06 tok/s).)

  # VRAM headroom the offload planner keeps back. The code defaults
  # (500 / 300 / 100 MB) were designed for large GPUs; on a 2 GB carve-out
  # they would reserve ~900 MB of 2048 MB and push layers back to the CPU.
  # [MACHINE-DEPENDENT]
  #                 safety  runtime  prompt
  # APU-2GB  :       50      100      50    (this box)
  # DGPU-8GB :      300      200     100
  # DGPU-24GB+:     500      300     100    (the code defaults)
  vram_safety_margin_mb: 50         # was 500 (designed for large GPUs)
  vram_runtime_overhead_mb: 100     # was 300 (designed for large GPUs)
  vram_system_prompt_overhead_mb: 50  # was 100 (designed for large GPUs)

  # Stops hammering a model that keeps failing to load: after
  # failure_threshold consecutive failures it refuses further loads for
  # recovery_timeout_s, then lets one probe through. [PORTABLE]
  circuit_breaker:
    failure_threshold: 3
    recovery_timeout_s: 60.0


# ════════════════════════════════════════════════════════════════════════════════
# ♻️ MODEL LIFECYCLE — Automatic load/unload and eviction
# ════════════════════════════════════════════════════════════════════════════════
# Passed to: ModelLifecycleManager(config=cfg["model_lifecycle"])
#
# [RESERVED in the server] — ModelLifecycleManager exists in local-llm-core
# but local_llm_server never instantiates it, so none of these keys act.
# What actually does the job in this release:
#   * idle unload ........... monitoring.idle_model_timeout_s (1800) and
#                             monitoring.idle_reaper_interval_s (60)
#   * memory pressure ....... memory.ram_utilization_target /
#                             memory.vram_utilization_target and
#                             drive_pipeline.memory_pressure
#   * what loads at startup . models.profiles[].autoload / priority /
#                             ram_required_mb
# Do not count on max_loaded_models: 8 as a safety net on this box — one
# Q4_K_M 8B already fills the budget.
#
# Validated if you use the manager: max_loaded_models ≥ 1,
# eviction_policy ∈ {lru, priority}, utilisations in 0.1-1.0.
model_lifecycle:
  # [MACHINE-DEPENDENT]
  # APU-2GB  : 1  (what actually fits; value below is the schema default)
  # DGPU-8GB : 2
  # DGPU-16GB: 3
  # DGPU-24GB: 4
  # DGPU-48GB: 8
  max_loaded_models: 8
  idle_timeout_s: 1800.0              # 30 minutes
  vram_target_utilization: 0.90
  ram_target_utilization: 0.75        # keep equal to memory.ram_utilization_target
  eviction_policy: "lru"              # lru | priority
  auto_evict_on_pressure: true
  check_interval_s: 15.0
  autoload_all: false


# ════════════════════════════════════════════════════════════════════════════════
# ⚛️ BITNET — 1-bit LLM global settings
# ════════════════════════════════════════════════════════════════════════════════
# Passed to: BitNetLoader(config=cfg["bitnet"])
#
# BitNet runs on the CPU on EVERY machine tier (ternary kernels have no GPU
# path), so nothing here is tier-dependent except whether you built
# bitnet.cpp at all. The schema default for `enabled` is TRUE; this file sets
# it FALSE on purpose — enabling it without a working bitnet.cpp build (or the
# pinned transformers commit) just produces load failures.
#
# [RESERVED] (validated, but no code path reads them in this release):
#   auto_detect_kernel_backend, force_kernel_backend, memory_fraction,
#   enable_speculative_decoding, enable_context_caching, fallback_to_cpu_on_oom
# Everything else is [LIVE] via BitNetSystemConfig.
#
# Optional keys that exist in the schema but are not set here:
#   bitnet_host: "127.0.0.1"   bitnet_n_ctx: 4096   bitnet_n_batch: 512
#   bitnet_parallel: 1
bitnet:
  # [MACHINE-DEPENDENT]
  # APU-2GB  : false  (this box — bitnet.cpp not built)
  # Any tier : true only after the build in models.profiles[bitnet-gguf]
  enabled: false
  default_quantization: "1bit"         # 1bit | 4bit | 8bit | mixed
  use_custom_kernels: true
  auto_detect_kernel_backend: true
  force_kernel_backend: null           # cuda | rocm | metal | cpu
  memory_fraction: 0.9
  enable_speculative_decoding: false   # Disabled — bitnet.cpp handles this natively
  enable_context_caching: true
  max_loaded_models: 2
  load_retries: 3
  fallback_to_cpu_on_oom: true

  # Which models.profiles entry BitNet uses when none is named. Was
  # "bitnet-packed" (the packed model that couldn't autoload); now points to
  # "bitnet-gguf" — the pre-converted GGUF profile that works immediately via
  # bitnet.cpp with no transformers dependency.
  default_model_id: "bitnet-gguf"
  profiles: []                         # Empty — uses models.profiles entries with format: bitnet

  # bitnet.cpp backend settings (used when llama-server binary is found)
  # bitnet_cpp_port: internal port of the spawned llama-server (1-65535).
  # Must not collide with server.port (8080) or any Prometheus port (9090).
  bitnet_cpp_port: 18080
  bitnet_n_threads: 0                  # 0 = auto-detect physical cores
  bitnet_n_gpu_layers: 0              # 0 = CPU-only (fastest for BitNet ternary weights)
  bitnet_force_backend: null           # transformers | bitnet_cpp | null


# ════════════════════════════════════════════════════════════════════════════════
# 🛡️ CIRCUIT BREAKER — Failure detection and recovery
# ════════════════════════════════════════════════════════════════════════════════
# Passed to: InferenceEngine and ModelLoader (reads cfg["circuit_breaker"])
#
# ⚠ MOSTLY [RESERVED] — only health_timeout_s is read from this section. The
# breakers that actually run are configured elsewhere, so editing the eight
# inference_* / loader_* keys below changes nothing:
#   inference breaker → inference.circuit_breaker_failure_threshold (5)
#                       inference.circuit_breaker_recovery_s        (60.0)
#   loader breaker    → model_loader.circuit_breaker.failure_threshold (3)
#                       model_loader.circuit_breaker.recovery_timeout_s (60.0)
# (Note this section says 10 failures where the live engine uses 5.)
circuit_breaker:
  inference_enabled: true
  inference_failure_threshold: 10
  inference_error_rate: 0.5
  inference_recovery_s: 60.0
  count_timeouts_as_failures: false

  loader_enabled: true
  loader_failure_threshold: 3
  loader_recovery_s: 60.0

  # [LIVE] how long /health waits for the engine's answer before reporting
  # it degraded. [PORTABLE]
  health_timeout_s: 5.0


# ════════════════════════════════════════════════════════════════════════════════
# 💬 CONVERSATION — Chat history persistence
# ════════════════════════════════════════════════════════════════════════════════
# Read by: create_conversation_store(cfg) — [LIVE] except where marked.
#
# storage:
#   memory      — lost on restart; the only backend that uses adaptive_lru /
#                 min_conversations. Fine for development.
#   sqlite      — one file (sqlite_path); zero extra services; single writer.
#   postgresql  — this box. Shares the Postgres already needed by the key
#                 store (api.*). Uses host/port/database/username/password.
#   mysql       — as postgresql (default port 3306).
#
# ⚠ If the chosen backend cannot be initialised at boot (database down, bad
# password) the server logs "falling back to memory" and carries on with
# NON-PERSISTENT history. The key store behaves the opposite way (fail-fast,
# api.key_store_allow_memory_fallback: false). Watch the startup log line
# "Conversation store: postgresql initialized".
#
# [MACHINE-DEPENDENT]
# APU-2GB  : "postgresql"  (this box, Postgres already running)
# Dev/lone box w/o Postgres: "sqlite"
# Multi-user / multi-node  : "postgresql"
conversation:
  enabled: true
  storage: "postgresql"

  # Used only when storage = sqlite (parent directory is created for you).
  sqlite_path: "/home/deve-oops/AMB-OPT/local-llm-cloud/tmp/llm_conversations.db"

  # Used only for postgresql / mysql. `port` is cast with int(), so the quoted
  # string is fine. The password is injected from ${LLM_DB_PASSWORD}.
  host: "localhost"
  port: "5432"
  database: "llm_conversations"
  username: "amb_llm"
  password: "${LLM_DB_PASSWORD}"

  # Connection pool (postgresql / mysql). Peak connections = pool_size +
  # max_overflow = 15 here, and api.* opens another 15 against the same
  # server: keep the total well under Postgres max_connections (default 100).
  # [MACHINE-DEPENDENT]
  # APU-2GB  : 10 / 5  (this box — a single-user server never needs more)
  # DGPU-24GB+ multi-user: 20 / 10
  pool_size: 10
  max_overflow: 5
  pool_timeout: 30                     # seconds to wait for a free connection
  pool_recycle: 3600                   # seconds before a connection is replaced

  # Transient-error retry: delay = retry_backoff_base × 2^attempt (+ jitter).
  retry_attempts: 3
  retry_backoff_base: 0.1
  retry_jitter: true

  # Retention. LRU-evicts conversations beyond max_conversations; keeps the
  # newest max_messages_per_conversation per chat; max_age_days is applied by
  # prune_old(), which the server runs on its own hourly loop.
  # [PORTABLE]
  max_conversations: 100
  max_messages_per_conversation: 100
  max_age_days: 7.0

  # Write-behind buffer: a batch is flushed after write_buffer_size messages
  # or write_flush_interval seconds, whichever comes first.
  write_buffer_size: 32
  write_flush_interval: 0.05

  # Idempotent writes: a retried add_message carrying the SAME lease token is
  # dropped instead of storing the message twice. Leave true.
  enable_lease: true

  # memory backend only (ignored for sqlite/postgresql/mysql):
  # adaptive_lru halves max_conversations while system RAM is > 85% used
  # (never below min_conversations) and doubles it back, up to 100, once RAM
  # is < 40% used.
  adaptive_lru: true
  min_conversations: 50

  # [RESERVED in the server] — api_server runs its own hourly prune loop
  # unconditionally (3600 s); these two are read only by the optional
  # ConversationManager helper that the server does not use.
  enable_background_prune: false
  prune_interval_seconds: 3600


# ════════════════════════════════════════════════════════════════════════════════
# 📡 WEBSOCKET — Streaming connections
# ════════════════════════════════════════════════════════════════════════════════
# [RESERVED] — the whole section. No component in this release reads
# cfg["websocket"] (there is no WebSocketManager class). Editing any value
# here has no effect. The only live WebSocket tunables are the log-stream
# ones under `logging`: ws_queue_size, broadcast_timeout_sec and
# ws_client_idle_timeout_sec (the /ws feed used by the TUI and web UI).
# There is no per-socket cap, ping or payload tuning in this release.
# Kept so the schema and existing tooling keep working.
websocket:
  send_timeout_sec: 2.0
  max_payload_bytes: 65536
  cleanup_interval_sec: 60.0
  ping_interval_sec: 30.0
  ping_timeout_sec: 5.0
  max_connections: 100
  max_connections_per_ip: 50
  enable_metrics: true
  backpressure_limit: 32
  broadcast_concurrency: 10
  idle_timeout_s: 120


# ════════════════════════════════════════════════════════════════════════════════
# 📊 MONITORING — Metrics, telemetry, SLA, idle-unload
# ════════════════════════════════════════════════════════════════════════════════
# What the server actually reads (api_server.py):
#   [LIVE] metrics_interval_s, prometheus_enabled, prometheus_port
#          → the one MetricsCollector the server builds (3 arguments only)
#   [LIVE] telemetry.*        → create_telemetry_collector(cfg)
#   [LIVE] performance.*      → the PerformanceAnalyzer behind /v1/performance
#   [LIVE] idle_model_timeout_s, idle_reaper_interval_s  → idle model unload
#   [LIVE] defrag_check_interval_s, defrag_queue_threshold
#   [RESERVED] metrics.*           — read only by create_metrics_collector(),
#                                    which the server does not call
#   [RESERVED] model_telemetry.*   — the server builds ModelTelemetry() with
#                                    its built-in defaults
#   [RESERVED] prometheus_addr, log_buffer_size (see notes), ws_reaper_interval_s,
#              anomaly_detection_enabled, anomaly_z_score_threshold,
#              log_slow_requests_ms
#
# ── Prometheus: the safe way ────────────────────────────────────────────────
# The API already serves GET /metrics on its own port (127.0.0.1:8080) — point
# Prometheus at that (see prometheus.yml.example). Keep every
# prometheus_enabled switch below FALSE: each one starts a SEPARATE exporter
# via prometheus_client.start_http_server(port), and
#   * they all default to the same port (9090), so a second one fails with
#     "Address already in use", and
#   * none of them honours prometheus_addr — the exporter binds ALL
#     interfaces (0.0.0.0), so "127.0.0.1" below is NOT a protection.
monitoring:
  # Sampling period of the live MetricsCollector. Every sample polls psutil
  # and the GPU, which steals CPU time from a bandwidth-bound decode.
  # [MACHINE-DEPENDENT]
  # APU-2GB  : 5.0  (this box)
  # DGPU     : 1.0-2.0
  metrics_interval_s: 5.0
  prometheus_enabled: false
  prometheus_port: 9090
  prometheus_addr: "127.0.0.1"         # [RESERVED] not honoured — see above

  # [RESERVED in the server] — consumed by create_metrics_collector(cfg).
  # gpu_analyzer.thermal_throttle_temp_c (not set here) would override
  # anomaly_temp_threshold_c.
  metrics:
    sample_interval_sec: 5.0
    history_size: 1200                 # 1200 × 5 s = 100 minutes
    prometheus_enabled: false
    prometheus_port: 9090
    anomaly_detection: true
    anomaly_latency_z_threshold: 5.0
    anomaly_temp_threshold_c: 85.0
    anomaly_min_gpu_util_for_temp_alert: 10.0
    gpu_temp_max_valid: 110.0          # readings above this are treated as sensor glitches
    gpu_cache_ttl_sec: 5.0
    adaptive_sampling: true
    adaptive_sampling_max_factor: 4.0
    adaptive_sampling_cpu_threshold: 80.0
    file_export_enabled: false
    file_export_path: "/tmp/llm_metrics.jsonl"

  # [LIVE] Request/resource telemetry behind /v1/telemetry.
  telemetry:
    collect_interval_sec: 5.0
    history_requests: 10000
    history_resources: 1440            # 1440 × 5 s = 2 hours
    prometheus_enabled: false          # keep false — see the Prometheus note above
    prometheus_port: 9090
    anomaly_window_size: 100
    anomaly_z_threshold: 3.0
    # Holt-style predictor of resource exhaustion (alpha = level, beta = trend,
    # k = how many standard deviations of headroom to demand).
    predictive_alpha: 0.3
    predictive_beta: 0.1
    predictive_k: 3.0
    file_export_enabled: false
    file_export_path: "/tmp/llm_telemetry.jsonl"

    # Alerts fire when a sample crosses these. The GPU-temperature alert only
    # fires while the GPU is actually busy (not on an idle warm iGPU).
    # [MACHINE-DEPENDENT]
    # APU-2GB  : ram 0.95 (this box — the APU shares RAM with the GPU, so it
    #            legitimately runs hot on memory)
    # DGPU     : vram 0.92-0.98, gpu_temp_c 80-85
    thresholds:
      vram_utilization: 0.98
      ram_utilization: 0.95
      gpu_temp_c: 85
      latency_p99_ms: 5000

    # [RESERVED in the server] — read only by the optional ModelTelemetry
    # auto-unload helper, which api_server does not start. Idle unload is done
    # by monitoring.idle_model_timeout_s below.
    auto_unload:
      enabled: false
      idle_threshold_seconds: 1800.0
      check_interval_seconds: 60.0
      pressure_vram_mb: null

  # [LIVE] SLA grading for GET /v1/performance. The tier is derived from the
  # VRAM in use and the model's size (determine_tier); a result slower than
  # that tier's targets is reported as an SLA miss and drives the
  # "recommendations" list.
  # ⚠ On this box 2gb.tps = 3.5 is ABOVE what the hardware can do (measured
  # 3.06 tok/s, theoretical ceiling ≈ 3.8 = 19.2 GB/s ÷ 5.03 GB per token), so
  # every request is graded as a miss. 2.5 gives a meaningful green baseline.
  # Left at 3.5 because this file never changes your values — edit it if you
  # want clean grading.
  # [MACHINE-DEPENDENT]
  # APU-2GB   : ttft_ms 5000, tps 2.5-3.5  (this box)
  # DGPU-8GB  : ttft_ms 1200, tps 50
  # DGPU-24GB+: ttft_ms 400,  tps 90
  performance:
    sla_targets:
      2gb:  { ttft_ms: 5000, tps: 3.5 }
      8gb:  { ttft_ms: 1200, tps: 50.0 }
      24gb: { ttft_ms: 400,  tps: 90.0 }
    history_size: 1000                 # samples kept per model
    trend_window: 30                   # newest samples used for the trend
    # A recommendation is raised when TTFT or TPS degrades by more than this
    # against the trend baseline.
    recommendation_threshold:
      ttft_degradation_pct: 20
      tps_degradation_pct: 20
    # null = history lives in RAM and is lost on restart. A path (inside a
    # ReadWritePaths= directory, e.g. /var/lib/local-llm/perf.db) persists it.
    history_db_path: null

  # [RESERVED in the server] — only used by create_model_telemetry().
  model_telemetry:
    rolling_window_size: 500
    ema_alpha: 0.1
    model_ranking:
      recency_half_life: 300.0

  # llm-monitor (the TUI) looks for a TOP-LEVEL `log_buffer_size`
  # (default 500), so this nested key is not picked up by it.
  log_buffer_size: 1000
  ws_reaper_interval_s: 60.0           # [RESERVED] see logging.reaper_interval_sec

  # [LIVE] Unload a model that has been idle this long, checked every
  # idle_reaper_interval_s. Frees the GTT/VRAM for the next request's model.
  # With a single resident model there is no cost to keeping it, except RAM
  # pressure for other programs on the box.
  # [MACHINE-DEPENDENT]
  # APU-2GB (shared with desktop apps): 1800.0 (this box) — or 600.0 if you
  #                                     need the RAM back sooner
  # Dedicated GPU server              : a very large value (e.g. 86400) to keep
  #                                     the model resident
  idle_model_timeout_s: 1800.0
  idle_reaper_interval_s: 60.0

  # [LIVE] Memory-defragmentation trigger: checked every
  # defrag_check_interval_s, acts when the request queue is longer than
  # defrag_queue_threshold. [PORTABLE]
  defrag_check_interval_s: 30.0
  defrag_queue_threshold: 2

  # [RESERVED] the live anomaly settings are monitoring.telemetry.anomaly_* .
  anomaly_detection_enabled: true
  anomaly_z_score_threshold: 3.0
  log_slow_requests_ms: 5000           # [RESERVED] not read by any code


# ════════════════════════════════════════════════════════════════════════════════
# 📝 LOGGING — Levels, file output, rotation, TUI handler
# ════════════════════════════════════════════════════════════════════════════════
# Read by serving/log_handler.py (TUILogHandler) and create_app() — [LIVE]
# except where marked.
#
# Disk use of the log file ≤ file_max_mb × (file_backups + 1) = 400 MB here.
logging:
  # debug is very chatty and the extra logging work competes with a
  # bandwidth-bound decode — use it for one reproduction, not as a default.
  # [PORTABLE]  info (production) | debug (one-off diagnosis) | warning
  level: "info"

  # Must be inside a ReadWritePaths= directory under systemd. null disables
  # the file handler (console / journald only).
  # [MACHINE-DEPENDENT]
  # this box : "/home/deve-oops/AMB-OPT/local-llm-cloud/logs/llm_server.log"
  # server   : "/var/log/local-llm/llm_server.log"
  file: "/home/deve-oops/AMB-OPT/local-llm-cloud/logs/llm_server.log"
  file_max_mb: 100                     # RotatingFileHandler maxBytes
  file_backups: 3                      # RotatingFileHandler backupCount

  # logging.format selects the FILE handler's layout:
  #   "text"    → human-readable, with the request id in it (needs the
  #               request-id filter, which create_app() always installs).
  #   "minimal" → compact one-line layout, no request id. This box.
  #   "json"    → one JSON object per line with request_id / key_id / path /
  #               status / latency_ms / tokens when supplied via extra={}.
  #               Best for jq, Loki, ELK.
  # [MACHINE-DEPENDENT]
  # APU-2GB / dev : "minimal" (this box) or "text"
  # Fleet / SIEM  : "json"
  format: "minimal"

  # [RESERVED] not read by the server's log handler (the client's own
  # config.yaml has a logging.date_format; this one is unused). use_structlog
  # is likewise unused.
  date_format: "%Y-%m-%d %H:%M:%S"
  use_structlog: false

  # ── TUI / WebSocket log stream (the /ws feed) ─────────────────────────────
  buffer_size: 1000                    # ring buffer: recent lines replayed to a new viewer
  ws_queue_size: 512                   # per-client outbound queue
  max_msg_len: 4096                    # longer lines are truncated
  reaper_interval_sec: 60.0            # how often stale viewer connections are swept
  broadcast_timeout_sec: 2.0           # per-client send timeout
  ws_client_idle_timeout_sec: 300.0    # a silent viewer is reaped after this

  # Viewer-side load shedding: once MORE than `threshold` WebSocket viewers
  # are connected, each line is forwarded with probability `rate` (10%). It
  # counts connected viewers, not lines per second, so it never triggers on a
  # one- or two-viewer box. The log FILE always gets every line.
  adaptive_sampling: true
  adaptive_sampling_threshold: 50
  adaptive_sampling_rate: 0.1

  # Consecutive identical messages inside this window are dropped from the
  # viewer feed (the log file is unaffected).
  deduplication_window_sec: 2.0

  # When the ring buffer is ≥ 90% full the oldest entries are flushed to this
  # file. Its directory is created on demand; if that fails, overflow
  # persistence is switched off (logged once) rather than crashing. Put it in
  # a writable state directory — the default /tmp/llm_log_overflow.jsonl is
  # wiped on reboot.
  overflow_file: "/var/lib/local-llm/log_overflow.jsonl"
  # Optional keys (not set here): console_level (null = same as level),
  # overflow_flush_interval_sec 30.0, dedup_cache_max_entries 10000,
  # dedup_cache_cleanup_age 10.0.


# ════════════════════════════════════════════════════════════════════════════════
# 🔐 SECURITY — Authentication switches and session signing
# ════════════════════════════════════════════════════════════════════════════════
# Only the last three keys (require_signed_sessions, allow_static_key_fallback,
# allow_no_auth) are [LIVE] — they are read by api_server.py and ALL default
# to the safe value. Every key above them is [RESERVED]: validated nowhere and
# read by no code in this release, so changing it neither tightens nor loosens
# anything. The protections that DO exist live elsewhere:
#   * request body size .............. server.max_body_size_mb
#   * temperature / top_p / top_k / max_tokens bounds ... the API's request
#     models (pydantic), not these flags
#   * prompt length .................. the context window (inference.* /
#     model_loader.max_context_tokens) — an over-long prompt is rejected there
#   * model file sandbox ............. models.allowed_dir (+ symlinks resolved)
#   * key hashing / HTTPS ............ handled by the key store / your reverse
#     proxy — put TLS in front (nginx, Caddy) for any non-localhost access
#
# Optional, read by ModelLoader when present (not set here):
#   model_base_dir: "/home/deve-oops/models"   extra base directory allowed
#   allowed_models: ["qwen3-8b"]              allowlist of loadable model ids
security:
  max_prompt_length: 100000            # [RESERVED]
  max_messages: 100                    # [RESERVED]
  validate_temperature: true           # [RESERVED]
  validate_top_p: true                 # [RESERVED]
  validate_top_k_min: 1                # [RESERVED]
  validate_max_tokens_min: 0           # [RESERVED]
  verify_model_paths: true             # [RESERVED] (models.allowed_dir is the live check)
  symlink_resolution: "strict"         # [RESERVED]
  hash_keys: true                      # [RESERVED]
  require_https_for_auth: false        # [RESERVED] terminate TLS in a proxy instead

  # require_signed_sessions (RCA S7, Option B): when true (default),
  # conversation sessions are signed HMAC tokens bound to the caller's
  # API key. An unsigned X-Session-ID header is ignored — the request
  # falls back to the signed llm_session cookie, or gets a fresh session.
  # This closes the S7 hole: a caller who learns another caller's session
  # id cannot use it, because the token cannot be forged for the wrong key.
  #
  # Set to false ONLY for single-tenant static-key deployments where:
  #   * key_store_enabled: false, AND
  #   * every caller shares the one static api.key, AND
  #   * you genuinely need per-client sessions via unsigned headers.
  # In that configuration there is one trust class, so the missing
  # signature binding has no security impact — but any deviation from
  # those three preconditions re-opens the hole. Leave at true unless
  # you have specifically verified the preconditions.
  # [PORTABLE] true on every machine.
  require_signed_sessions: true

  # allow_static_key_fallback (RCA 2b): when api.key_store_enabled is
  # false AND api.key is set in this file, this flag controls whether
  # requests authenticated with that static key are accepted.
  #
  # Default: false. The static-key path is removed from verify_api_key's
  # hot path entirely. If key_store_enabled is false AND this is false,
  # ALL requests are rejected with 403 — a deployment without a key store
  # simply cannot authenticate anyone. That is the fail-closed default
  # and what production should use.
  #
  # Set to true ONLY for single-tenant dev deployments where:
  #   * key_store_enabled: false, AND
  #   * api.key is set to a strong random value (NOT the placeholder),
  #   * the server is bound to 127.0.0.1.
  # Any other configuration re-opens the S1/S3 findings.
  # [PORTABLE] false on every machine that has a key store (this box does).
  allow_static_key_fallback: false

  # allow_no_auth (RCA 2b): the "no key store, no static key, no auth at
  # all" state. Previously returned True (fail-OPEN) — every endpoint was
  # publicly readable. Now defaults to false: the auth dependency returns
  # 403 to every request when this state is reached.
  #
  # Set to true ONLY for local development where every client is trusted.
  # Do not set this on any server reachable from another machine.
  # [PORTABLE] false everywhere except a throw-away dev laptop.
  allow_no_auth: false


# ════════════════════════════════════════════════════════════════════════════════
# 🔄 SHUTDOWN — Graceful termination
# ════════════════════════════════════════════════════════════════════════════════
# [RESERVED] — the whole section. Nothing reads cfg["shutdown"]; changing
# these values does not change how the server stops. The real shutdown
# sequence is:
#   1. SIGTERM → the server stops accepting new requests
#   2. in-flight requests get `--drain-timeout` seconds to finish
#      (ExecStart passes 120; the CLI default is 120)
#   3. ModelLoader.shutdown() unloads models, bounded by
#      model_loader.shutdown_timeout_s (10 s)
#   4. systemd SIGKILLs the process after TimeoutStopSec (150 s in the unit)
# Keep TimeoutStopSec > --drain-timeout + model_loader.shutdown_timeout_s, or
# systemd will kill a server that was still draining cleanly.
shutdown:
  timeout_s: 30
  engine_timeout_s: 30.0
  close_websockets_first: true
  flush_logs: true
  close_databases: true


# ════════════════════════════════════════════════════════════════════════════════
# ⚖️ LOAD BALANCER — Multi-node distribution
# ════════════════════════════════════════════════════════════════════════════════
# [RESERVED] — the whole section. There is no LoadBalancer implementation in
# this release and `nodes` is empty. To run several nodes today, put an
# external balancer (nginx, HAProxy, Traefik, a cloud LB) in front and:
#   * health-check  GET /health  on every node (≈ every 10 s, 3 failures out,
#     2 successes in — the numbers below are a good starting point)
#   * use least-connections routing
#   * give every node the SAME postgresql conversation/key stores so any node
#     can serve any session
#   * hash on the client IP or the session cookie if you want the NVMe/prefix
#     KV cache to stay warm: that cache is per-node
# The settings below are the intended values for a future built-in balancer.
load_balancer:
  strategy: "least_loaded"
  health_check_interval_sec: 10.0
  unhealthy_threshold: 3
  recovery_threshold: 2
  health_check_timeout_sec: 5.0
  sticky_sessions: false
  adaptive_rl_alpha: 0.2
  adaptive_rl_gamma: 0.9
  nodes: []


# ════════════════════════════════════════════════════════════════════════════════
# 🧪 DEBUG — Development flags (disable in production)
# ════════════════════════════════════════════════════════════════════════════════
# [RESERVED in the server] — local_llm_server reads nothing under `debug`.
# Every flag is off and should stay off in production.
#
# ⚠ llm-monitor (the TUI) DOES look at a key named `debug` — but it expects a
# boolean. It evaluates `args.debug or cfg.get("debug", False)`, and this block
# is a mapping, which is always truthy, so whenever the TUI auto-loads this
# file it switches its own debug logging ON even though debug.enabled is
# false. Work-arounds: launch it from a directory that has no config.yaml, or
# fix monitor.py to read `cfg.get("debug", {}).get("enabled", False)` when the
# value is a dict.
debug:
  enabled: false
  request_id_length: 16
  profile_slow_requests: false
  profile_threshold_ms: 100
  fake_model_enabled: false
